{% extends "admin/base.html" %}
{% block title %}Senha{% endblock %}
{% block help %}
<p>Escolha uma senha com pelo menos 8 caracteres que só você saiba. Ninguém da Snep ou do suporte vai pedir sua senha.</p>
{% endblock %}
{% block content %}
<form method="post" class="card narrow">
  {{ csrf() }}
  <h1>Trocar senha</h1>
  <label>Senha atual<input name="current" type="password" autocomplete="current-password" required></label>
  <label>Nova senha (mínimo 8 caracteres)<input name="new" type="password" autocomplete="new-password" minlength="8" required></label>
  <label>Repita a nova senha<input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
  <button class="primary">Salvar nova senha</button>
</form>
{% endblock %}
