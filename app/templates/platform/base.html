<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Plataforma{% endblock %} · Plataforma</title>
<link rel="stylesheet" href="{{ static_url('css/admin.css') }}">
</head>
<body class="platform">
{% macro csrf() %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endmacro %}
<header class="top">
  <div class="wrap bar">
    <div class="brand">Plataforma <span class="pill">só você vê</span></div>
    {% if me %}
    <form method="post" action="{{ url_for('platform.logout') }}">{{ csrf() }}<button class="ghost">Sair</button></form>
    {% endif %}
  </div>
  {% if me %}
  <nav class="wrap tabs">
    <a href="{{ url_for('platform.index') }}" class="{{ 'cur' if request.endpoint in ('platform.index', 'platform.tenant_edit') }}">Pizzarias</a>
    <a href="{{ url_for('platform.tenant_new') }}" class="{{ 'cur' if request.endpoint == 'platform.tenant_new' }}">Nova pizzaria</a>
    <a href="{{ url_for('platform.password') }}" class="{{ 'cur' if request.endpoint == 'platform.password' }}">Minha senha</a>
  </nav>
  {% endif %}
</header>
<main class="wrap">
  {% for category, message in get_flashed_messages(with_categories=true) %}
  <p class="flash {{ category }}" role="status">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
