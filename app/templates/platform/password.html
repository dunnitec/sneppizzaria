{% extends "platform/base.html" %}
{% block title %}Minha senha{% endblock %}
{% block content %}
<form method="post" class="card narrow">
  {{ csrf() }}
  <h1>Trocar minha senha</h1>
  <label>Senha atual<input name="current" type="password" autocomplete="current-password" required></label>
  <label>Senha nova<input name="new" type="password" autocomplete="new-password" minlength="8" required></label>
  <label>Repita a senha nova<input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
  <button class="primary">Trocar senha</button>
</form>
{% endblock %}
