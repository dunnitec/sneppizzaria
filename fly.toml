app = "snep-pizzaria"
primary_region = "gru"

[build]

[env]
  PORT = "8080"

# roda antes de cada deploy: cria/atualiza as tabelas sem apagar dados
[deploy]
  release_command = "flask db upgrade"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
